[base]
package = ocean
env_name = puffer_drive_mtr
policy_name = DriveMTR
; No RNN wrapper needed - MTR uses Transformer attention for temporal context

[vec]
num_workers = 4
num_envs = 16
batch_size = 8

[policy]
; MTR architecture parameters (minimal for single GPU)
; Original: d_model=256, encoder_layers=6, decoder_layers=6 (~26M params)
; Lite: d_model=128, encoder_layers=3, decoder_layers=3 (~3.7M params)
; Minimal: d_model=64, encoder_layers=2, decoder_layers=2 (~1M params)
d_model = 64
hidden_size = 64
nhead = 2
num_encoder_layers = 2
num_decoder_layers = 2
num_queries = 4
num_future_frames = 40
dropout = 0.1

[env]
num_agents = 512
; Options: discrete, continuous
action_type = discrete
; Options: classic, jerk
dynamics_model = classic
reward_vehicle_collision = -0.5
reward_offroad_collision = -0.5
dt = 0.1
reward_goal = 1.0
reward_goal_post_respawn = 0.25
; Meters around goal to be considered "reached"
goal_radius = 2.0
; Max target speed in m/s for the agent to maintain towards the goal
goal_speed = 100.0
; What to do when the goal is reached. Options: 0:"respawn", 1:"generate_new_goals", 2:"stop"
goal_behavior = 0
; Determines the target distance to the new goal in the case of goal_behavior = generate_new_goals.
goal_target_distance = 30.0
; Options: 0 - Ignore, 1 - Stop, 2 - Remove
collision_behavior = 0
; Options: 0 - Ignore, 1 - Stop, 2 - Remove
offroad_behavior = 0
episode_length = 91
; Resample frequency can be > episode_length because get_expert_action_at_timestep()
; uses modulo to wrap timestep within episode bounds.
resample_frequency = 455
termination_mode = 1
map_dir = "resources/drive/binaries/training"
num_maps = 10000
init_steps = 0
control_mode = "control_vehicles"
init_mode = "create_all_valid"

[train]
seed = 42
total_timesteps = 200_000_000
anneal_lr = True
batch_size = 262144
minibatch_size = 2048
max_minibatch_size = 2048
bptt_horizon = 32
adam_beta1 = 0.9
adam_beta2 = 0.999
adam_eps = 1e-8
clip_coef = 0.2
ent_coef = 0.005
gae_lambda = 0.95
gamma = 0.98
; Lower LR for larger MTR model
learning_rate = 0.0003
max_grad_norm = 1
prio_alpha = 0.85
prio_beta0 = 0.85
update_epochs = 1
vf_clip_coef = 0.2
vf_coef = 2
vtrace_c_clip = 1
vtrace_rho_clip = 1
checkpoint_interval = 1000
render = False
render_interval = 1000
obs_only = True
show_grid = True
show_lasers = False
show_human_logs = False
zoom_in = True
render_map = none

; Imitation learning coefficient (optional for baseline)
imit_coef = 0.0

[eval]
eval_interval = 1000
map_dir = "resources/drive/binaries/validation"
num_maps = 20
backend = PufferEnv
wosac_realism_eval = False
wosac_num_rollouts = 32
wosac_init_steps = 10
wosac_control_mode = "control_wosac"
wosac_init_mode = "create_all_valid"
wosac_goal_behavior = 2
wosac_goal_radius = 2.0
wosac_sanity_check = False
wosac_aggregate_results = True
human_replay_eval = False
human_replay_control_mode = "control_sdc_only"

[sweep.train.learning_rate]
distribution = log_normal
min = 0.0001
mean = 0.0003
max = 0.001
scale = auto

[sweep.train.ent_coef]
distribution = log_normal
min = 0.001
mean = 0.005
max = 0.03
scale = auto
