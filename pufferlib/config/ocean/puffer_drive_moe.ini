[base]
package = ocean
env_name = puffer_drive_moe
policy_name = DriveMoE
rnn_name = Recurrent

[vec]
num_workers = 4
num_envs = 16
batch_size = 8

[policy]
input_size = 64
hidden_size = 256
; MoE-specific parameters
num_experts = 2
lora_rank = 8
lora_alpha = 8.0
router_hidden_dim = 64
freeze_base = True
; Expert prior for KL loss (from open-loop Polysona: [0.3, 0.6, 0.1])
; If not set, uses uniform prior
expert_prior = [0.7, 0.3]
; Path to pretrained Drive checkpoint to initialize base weights (loaded with strict=False)
base_checkpoint = "experiments_old/puffer_drive_baseline.pt"
; Social forces routing (similar to Polysona)
; If True, use physics-based social forces for routing instead of learned features
use_social_forces_routing = True
; If True (and use_social_forces_routing=True), use only social forces for routing
; If False, fuse social forces with encoded context features
social_forces_only = False
; Goal prediction: If True, policy predicts its own goal from context
; Goals in observations will be zeroed out; policy must learn to predict them
predict_goal = True
; Hidden dimension for goal prediction head
goal_hidden_dim = 32

[rnn]
input_size = 256
hidden_size = 256

[env]
num_agents = 1024
; Options: discrete, continuous
action_type = discrete
; Options: classic, jerk
dynamics_model = classic
reward_vehicle_collision = -0.5
reward_offroad_collision = -0.5
dt = 0.1
reward_goal = 1.0
reward_goal_post_respawn = 0.25
; Meters around goal to be considered "reached"
goal_radius = 2.0
; Max target speed in m/s for the agent to maintain towards the goal
goal_speed = 100.0
; What to do when the goal is reached. Options: 0:"respawn", 1:"generate_new_goals", 2:"stop"
goal_behavior = 0
; Determines the target distance to the new goal in the case of goal_behavior = generate_new_goals.
goal_target_distance = 30.0
; Options: 0 - Ignore, 1 - Stop, 2 - Remove
collision_behavior = 0
; Options: 0 - Ignore, 1 - Stop, 2 - Remove
offroad_behavior = 0
episode_length = 91
; Resample frequency can be > episode_length because get_expert_action_at_timestep()
; uses modulo to wrap timestep within episode bounds. This allows imitation learning
; across multiple episodes (5 episodes here) while reducing map loading overhead.
; The last timestep of each episode (tick % 91 == 90) has no expert action.
resample_frequency = 455
termination_mode = 1
map_dir = "resources/drive/binaries/training"
num_maps = 10000
init_steps = 0
control_mode = "control_vehicles"
init_mode = "create_all_valid"
; Goal prediction: If True, goal observations are zeroed out and policy predicts goals
predict_goal = True

[train]
seed = 42
total_timesteps = 100_000_000
anneal_lr = False
batch_size = 524288
minibatch_size = 32768
max_minibatch_size = 32768
bptt_horizon = 32
adam_beta1 = 0.9
adam_beta2 = 0.999
adam_eps = 1e-8
clip_coef = 0.2
ent_coef = 0.005
gae_lambda = 0.95
gamma = 0.98
learning_rate = 0.003
max_grad_norm = 1
prio_alpha = 0.8499999999999999
prio_beta0 = 0.8499999999999999
update_epochs = 1
vf_clip_coef = 0.1999999999999999
vf_coef = 2
vtrace_c_clip = 1
vtrace_rho_clip = 1
checkpoint_interval = 1000
render = False
render_interval = 1000
obs_only = True
show_grid = True
show_lasers = False
show_human_logs = False
zoom_in = True
render_map = none

; MoE auxiliary loss coefficients (start low to not interfere with policy learning)
aux_kl_coef = 1.
aux_entropy_coef = 0.01
aux_cosine_coef = 0.1
; Output diversity loss (encourages experts to produce different action distributions)
; This is more expensive to compute but directly addresses expert collapse
aux_output_div_coef = 0.1
; Reconstruction loss coefficient (VAE-style, from Polysona)
; Reconstructs social forces from expert probabilities to ensure latent captures context
aux_reconstruction_coef = 1.0

; Goal prediction loss coefficient (MSE loss between predicted and logged goals)
; Ensures policy predictions converge to useful goals from logged trajectory endpoints
aux_goal_pred_coef = 1.0

; Imitation learning coefficient (cross-entropy loss with human expert actions)
; Set to 0 to disable imitation learning
imit_coef = 0 # 0.05

; Temperature annealing (Gumbel-Softmax)
moe_tau_max = 2.0
moe_tau_min = 0.1

; DIAYN diversity objective
; Trains a discriminator to classify trajectories by expert, rewards policy for being distinguishable
diayn_enabled = True
; Weight for diversity reward: r_total = r_task + diayn_coef * r_div
diayn_coef = 0.1
; Number of timesteps in trajectory window for discriminator
diayn_trajectory_window = 50
; Hidden dimension for discriminator MLP
diayn_hidden_dim = 128
; Learning rate for discriminator (separate from policy)
diayn_lr = 0.0003
; Whether to use 1D convolution (True) or MLP (False) for discriminator
diayn_use_conv = False

[eval]
eval_interval = 1000
map_dir = "resources/drive/binaries/validation"
num_maps = 20
backend = PufferEnv
wosac_realism_eval = False
wosac_num_rollouts = 32
wosac_init_steps = 10
wosac_control_mode = "control_wosac"
wosac_init_mode = "create_all_valid"
wosac_goal_behavior = 2
wosac_goal_radius = 2.0
wosac_sanity_check = False
wosac_aggregate_results = True
human_replay_eval = False
human_replay_control_mode = "control_sdc_only"

[sweep.train.learning_rate]
distribution = log_normal
min = 0.001
mean = 0.003
max = 0.005
scale = auto

[sweep.train.ent_coef]
distribution = log_normal
min = 0.001
mean = 0.005
max = 0.03
scale = auto

[sweep.train.gamma]
distribution = log_normal
min = 0.97
mean = 0.98
max = 0.999
scale = auto

[sweep.train.gae_lambda]
distribution = log_normal
min = 0.95
mean = 0.98
max = 0.999
scale = auto

[controlled_exp.train.goal_speed]
values = [10, 20, 30, 3]

[controlled_exp.train.ent_coef]
values = [0.001, 0.005, 0.01]

[controlled_exp.train.seed]
values = [42, 55, 1]

[sweep.policy.num_experts]
distribution = choice
values = [2, 3, 5]

[sweep.train.aux_kl_coef]
values = [0.1, 1.0, 2.0]

[controlled_exp.policy.num_experts]
values = [2, 3, 5]
